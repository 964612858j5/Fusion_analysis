# docs/v17_mac_install_plan.md: a fresh install with the Mac installer on
# Apple silicon (macos-latest), without the models (no model download in CI; the
# engines' self-test runs on the lab's Mac), a rerun that changes nothing,
# and the launcher's refusal of another checkout's record. GitHub's macOS
# runners have no usable MPS: the GPU side is checked on a real Mac.
name: block01_mac_tests

on:
  push:
    branches: [v17]
    paths:
      - "scripts/install_block01_mac.sh"
      - "scripts/block01"
      - "envs/macos/**"
      - "envs/block01_spatialdata/**"
      - "envs/ci/requirements-cpu.txt"
      - "native/fusion_viewer_core/wheels.lock"
      - "tests/test_install_scripts_mac.py"
      - ".github/workflows/block01_mac_tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-install:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install with scripts/install_block01_mac.sh (no models)
        run: /bin/bash scripts/install_block01_mac.sh --skip-models --root "$RUNNER_TEMP/b01"
      - name: A second run changes nothing and passes
        run: /bin/bash scripts/install_block01_mac.sh --skip-models --root "$RUNNER_TEMP/b01"
      - name: Step 4's SpatialData export with the installed SpatialData environment
        run: |
          . .block01/install.env
          [ -n "${BLOCK01_SPATIALDATA_PYTHON:-}" ] || { echo "the install recorded no SpatialData Python"; exit 1; }
          cd .block01/pkg/block01/tests
          PYTHONPATH="$GITHUB_WORKSPACE/.block01/pkg" QT_QPA_PLATFORM=offscreen \
            "$BLOCK01_PREFIX/bin/python" -m pytest -q -p no:cacheprovider test_spatialdata_export.py
      - name: The launcher refuses another checkout's record clearly
        run: |
          rec=.block01/install.env
          cp "$rec" "$rec.bak"
          sed -i '' 's|^BLOCK01_CHECKOUT=.*$|BLOCK01_CHECKOUT=/elsewhere|' "$rec"
          out=$(/bin/bash scripts/block01 2>&1 < /dev/null || true)
          mv -f "$rec.bak" "$rec"
          echo "$out"
          echo "$out" | grep -q "names another checkout" || { echo "the launcher did not refuse"; exit 1; }
      - name: The static checks of the installers
        # the Python the installer just made (pytest is in its pins); the
        # runner's Homebrew Python refuses pip installs (PEP 668)
        run: |
          . .block01/install.env
          "$BLOCK01_PREFIX/bin/python" -m pytest -q -p no:cacheprovider --noconftest tests/test_install_scripts_mac.py
      - name: The install log
        if: always()
        run: |
          for f in .block01/logs/install-*.log; do [ -f "$f" ] && { echo "== $f"; tail -n 80 "$f"; }; done
          for f in .block01/run/*.err; do [ -f "$f" ] && { echo "== $f"; tail -n 40 "$f"; }; done
          true
