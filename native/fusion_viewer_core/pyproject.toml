[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "fusion_viewer_core"
requires-python = ">=3.10"
description = "Block01 Step1 viewer performance core (Rust, v16_5)"
dynamic = ["version"]
# the translated ARM powf (src/fuse_powf.rs) ships its MIT notice in the wheel
license-files = ["THIRD_PARTY_NOTICES.md"]

[tool.maturin]
features = ["pyo3/extension-module"]
